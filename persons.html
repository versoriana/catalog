	<!-- Script CETEI -->
	<script>
		var CETEIcean = new CETEI({ ignoreFragmentId: true });   // #hash scrolling is done by catalog-table.js

		// Copy an entry's permalink (the link's existing href) to the clipboard,
		// with brief "Copied!" feedback on the button.
		function copyEntryLink(link) {
			const url = link.href;
			const flash = function() {
				const lbl = link.querySelector('.copy-link-label');
				if (lbl) {
					lbl.textContent = 'Copied!';
					link.classList.add('copied');
					setTimeout(function() {
						lbl.textContent = 'Copy link';
						link.classList.remove('copied');
					}, 1500);
				}
			};
			if (navigator.clipboard && navigator.clipboard.writeText) {
				navigator.clipboard.writeText(url).then(flash).catch(flash);
			} else {
				const ta = document.createElement('textarea');
				ta.value = url;
				ta.style.position = 'fixed';
				ta.style.opacity = '0';
				document.body.appendChild(ta);
				ta.select();
				try { document.execCommand('copy'); } catch (err) { /* ignore */ }
				document.body.removeChild(ta);
				flash();
			}
		}

		// Role mapping for Library of Congress relator vocabulary
		const roleMapping = {
			'fmo': 'Former owner',
			'scr': 'Scribe',
			'ann': 'Annotator',
			'aut': 'Author',
            'tch': 'Master', // actually "teacher" in the relator vocabulary,
            'pat': 'Patron', // LC relator vocabulary does not have a specific term for students, so we use LC Subject Headings
            'sh87002712': 'School principal' // LC relator vocabulary does not have a specific term for students, so we use LC Subject Headings
		};
	  
		// Define global behaviors for TEI elements
		let behaviors = {
			"tei": {
				// "teiHeader": null,
				"note": renderTeiNote,   // js/tei-notes.js
				"ref": function(e) {
					// A ref to a manuscript id ("#Oxford_…") points into manuscripts.html, not into
					// this page; external URLs open in a new tab.
					const target = e.getAttribute('target') || '';
					const link = document.createElement('a');
					link.innerHTML = e.innerHTML || target;
					if (target.startsWith('#')) {
						link.href = `manuscripts.html#${encodeURIComponent(target.slice(1))}`;
					} else if (/^https?:\/\//.test(target)) {
						link.href = target;
						link.target = '_blank';
						link.rel = 'noopener';
					} else {
						return null;
					}
					return link;
				},
				"birth": function(e) {
					const when = e.getAttribute('when');
					const notBefore = e.getAttribute('notBefore');
					const notAfter = e.getAttribute('notAfter');
					const ca = e.getAttribute('cert') === 'medium' ? 'ca. ' : '';

					let container = document.createElement('span');
					container.className = 'birth-info';

					if (when) {
						container.textContent = `${ca}${when}`;
					} else if (notBefore && notAfter) {
						container.textContent = `${ca}${notBefore}–${notAfter}`;
					} else if (notBefore) {
						container.textContent = `${ca}not before ${notBefore}`;
					} else if (notAfter) {
						container.textContent = `${ca}not after ${notAfter}`;
					}

					return container;
				},
				"death": function(e) {
					const when = e.getAttribute('when');
					const notBefore = e.getAttribute('notBefore');
					const notAfter = e.getAttribute('notAfter');
					const ca = e.getAttribute('cert') === 'medium' ? 'ca. ' : '';

					let container = document.createElement('span');
					container.className = 'death-info';

					if (when) {
						container.textContent = `${ca}${when}`;
					} else if (notBefore && notAfter) {
						container.textContent = `${ca}${notBefore}–${notAfter}`;
					} else if (notBefore) {
						container.textContent = `${ca}post ${notBefore}`;
					} else if (notAfter) {
						container.textContent = `${ca}not after ${notAfter}`;
					}

					return container;
				},
                "floruit": function(e) {
                    const when = e.getAttribute('when');
                    const from = e.getAttribute('from');
                    const to = e.getAttribute('to');
                    const ca = e.getAttribute('cert') === 'medium' ? 'ca. ' : '';

                    let container = document.createElement('span');
                    container.className = 'floruit-info';

                    if (when) {
                        container.textContent = `${ca}${when}`;
                    } else if (from && to) {
                        container.textContent = `${ca}${from}–${to}`;
                    } else if (from) {
                        container.textContent = `${ca}from ${from}`;
                    } else if (to) {
                        container.textContent = `${ca}to ${to}`;
                    }

                    return container;
                },
				"occupation": function(e) {
					// All <occupation>s of a person are rendered once, as one "Role:" line, in the
					// first occupation; the others render nothing. Grouped by role in document order:
					//   Scribe of mss. <a data-ms>…</a>, <a data-ms>…</a>; Former owner of ms. <a data-ms>…</a>
					// The links carry the ms id; js/person-panel.js replaces it with the shelfmark.
					const person = e.closest('tei-person') || e.parentElement;
					if (person._occupationProcessed) return null;
					person._occupationProcessed = true;

					const occupations = Array.from(person.children)
						.filter(c => c.localName === 'tei-occupation');

					// role -> [ms ids]. <occupation> is always empty (role + ref); any prose about
					// the role is in note[@type="role"], which continues this line (versoris.css)
					const groups = new Map();
					occupations.forEach(occ => {
						const ms = (occ.getAttribute('ref') || '').replace(/^#/, '');
						(occ.getAttribute('role') || '').split(/\s+/).filter(Boolean).forEach(role => {
							if (!groups.has(role)) groups.set(role, []);
							groups.get(role).push(ms);
						});
					});

					const container = document.createElement('div');
					container.className = 'tei-occupation';
					let first = true;
					groups.forEach((entries, role) => {
						if (!first) container.appendChild(document.createTextNode('; '));
						first = false;
						const label = roleMapping[role] || role;
						const withMs = entries.filter(Boolean);
						if (!withMs.length) {
							container.appendChild(document.createTextNode(label));
						} else {
							container.appendChild(document.createTextNode(
								`${label} of ${withMs.length > 1 ? 'mss.' : 'ms.'} `));
							withMs.forEach((ms, i) => {
								if (i) container.appendChild(document.createTextNode(', '));
								const link = document.createElement('a');
								link.className = 'ms-link';
								link.dataset.ms = ms;
								link.href = `manuscripts.html#${encodeURIComponent(ms)}`;
								link.textContent = ms;
								container.appendChild(link);
							});
						}
					});
					return container;
				},
				"idno": function(e) {
					const type = e.getAttribute('type');
					const idno = e.textContent.trim();

					let url = '';

					switch(type) {
						case 'VIAF':
							url = `https://viaf.org/viaf/${idno}`;
							break;
						case 'GND':
							url = `https://d-nb.info/gnd/${idno}`;
							break;
						case 'CERL':
							url = `https://data.cerl.org/thesaurus/${idno}`;
							break;
						case 'CAC':
							url = `https://cac.historia.uj.edu.pl/osoba/${idno}`;
							break;
						default:
							return null; // Use default behavior for other types
					}

					// Two-part "double button": a label segment that links out
					// to the authority, plus a colored segment showing the id value.
					// js/person-panel.js gathers these at the end of the record.
					const container = document.createElement('span');
					container.className = `double-button db-${type}`;

					const label = document.createElement('a');
					label.className = 'double-button-l';
					label.href = url;
					label.target = '_blank';
					label.rel = 'noopener';
					label.title = `${type}: ${idno}`;
					label.innerHTML = `${type} <i class="bi bi-box-arrow-up-right"></i>`;

					const value = document.createElement('span');
					value.className = 'double-button-r';
					value.textContent = idno;

					container.appendChild(label);
					container.appendChild(value);

					return container;
				},
				"persName": function(e) {
					// Don't display sort persName
					if (e.getAttribute('type') === 'sort') {
						return null;
					}

					// Check if already processed
					if (e.getAttribute('data-processed')) {
						return undefined;
					}
					e.setAttribute('data-processed', 'true');

					// Extract name components from children
					const preferredElements = [];
					const variantForenames = [];
					const variantNameLinks = [];
					const variantSurnames = [];

					Array.from(e.children).forEach(child => {
						const tagName = child.tagName ? child.tagName.toLowerCase() : '';
						const type = child.getAttribute('type');

						if (type === 'preferred') {
							preferredElements.push(child);
						} else if (type === 'variant') {
							if (tagName.includes('forename')) {
								variantForenames.push(child);
							} else if (tagName.includes('namelink')) {
								variantNameLinks.push(child);
							} else if (tagName.includes('surname')) {
								variantSurnames.push(child);
							}
						}
					});

					// Check if parallel variants
					// Count total nameLinks (preferred + variant) to see if component exists
					const totalNameLinks = Array.from(e.children).filter(child => {
						const tag = child.tagName ? child.tagName.toLowerCase() : '';
						return tag.includes('namelink');
					}).length;

					let hasParallelVariants = false;

					// If no nameLink component exists at all, check forename:surname match
					if (totalNameLinks === 0) {
						hasParallelVariants = variantForenames.length > 0 &&
							variantSurnames.length > 0 &&
							variantForenames.length === variantSurnames.length;
					} else {
						// If nameLink exists, all three must have matching variant counts
						hasParallelVariants = variantForenames.length > 0 &&
							variantNameLinks.length > 0 &&
							variantSurnames.length > 0 &&
							variantForenames.length === variantNameLinks.length &&
							variantForenames.length === variantSurnames.length;
					}

					// PARALLEL MODE
					if (hasParallelVariants) {
						const container = document.createElement('div');
						container.className = 'persname-container';

						const preferredGroup = document.createElement('span');
						preferredGroup.className = 'name-group-preferred';

						preferredElements.forEach((child, index) => {
							const part = document.createElement('span');
							part.className = 'name-part';
							part.textContent = child.textContent.trim();
							preferredGroup.appendChild(part);
							// Add space after each part except the last
							if (index < preferredElements.length - 1) {
								preferredGroup.appendChild(document.createTextNode(' '));
							}
						});
						container.appendChild(preferredGroup);

						const numVariants = Math.max(variantForenames.length, variantNameLinks.length, variantSurnames.length);
						for (let i = 0; i < numVariants; i++) {
							const variantGroup = document.createElement('span');
							variantGroup.className = 'name-group-variant';

							const parts = [];
							if (variantForenames[i]) parts.push(variantForenames[i]);
							if (variantNameLinks[i]) parts.push(variantNameLinks[i]);
							if (variantSurnames[i]) parts.push(variantSurnames[i]);

							parts.forEach((element, index) => {
								const part = document.createElement('span');
								part.className = 'name-part';
								// Add "alias " prefix for pseudo names
								const subtype = element.getAttribute('subtype');
								if (subtype === 'pseudo') {
									part.textContent = 'alias ' + element.textContent.trim();
								} else {
									part.textContent = element.textContent.trim();
								}
								variantGroup.appendChild(part);
								// Add space after each part except the last
								if (index < parts.length - 1) {
									variantGroup.appendChild(document.createTextNode(' '));
								}
							});

							container.appendChild(variantGroup);
						}

						return container;
					}

					// INLINE MODE
					const container = document.createElement('div');
					container.className = 'persname-container';

					// Preferred line (clean, no variants)
					const preferredGroup = document.createElement('span');
					preferredGroup.className = 'name-group-preferred';
					preferredElements.forEach((child, index) => {
						const part = document.createElement('span');
						part.className = 'name-part';
						part.textContent = child.textContent.trim();
						preferredGroup.appendChild(part);
						// Add space after each part except the last
						if (index < preferredElements.length - 1) {
							preferredGroup.appendChild(document.createTextNode(' '));
						}
					});
					container.appendChild(preferredGroup);

					// Variant line (if any variants exist)
					const hasVariants = variantForenames.length > 0 || variantNameLinks.length > 0 || variantSurnames.length > 0;
					if (hasVariants) {
						const variantGroup = document.createElement('span');
						variantGroup.className = 'name-group-variant';

						// Map each preferred element to its following variants by position in XML
						const preferredWithVariants = [];
						const allChildren = Array.from(e.children);

						preferredElements.forEach(prefEl => {
							const prefIndex = allChildren.indexOf(prefEl);
							const prefTag = prefEl.tagName ? prefEl.tagName.toLowerCase() : '';
							const variants = [];

							// Collect variants that follow this preferred element
							for (let i = prefIndex + 1; i < allChildren.length; i++) {
								const child = allChildren[i];
								const childTag = child.tagName ? child.tagName.toLowerCase() : '';
								const childType = child.getAttribute('type');

								// Stop if we hit another preferred element or different component type
								if (childType === 'preferred') break;
								if (!childTag.includes(prefTag.replace('tei-', ''))) break;

								// Collect variant of same type
								if (childType === 'variant' && childTag.includes(prefTag.replace('tei-', ''))) {
									const variantText = child.textContent.trim();
									// Add "alias " prefix for pseudo names
									const subtype = child.getAttribute('subtype');
									if (subtype === 'pseudo') {
										variants.push('alias ' + variantText);
									} else {
										variants.push(variantText);
									}
								}
							}

							preferredWithVariants.push({
								text: prefEl.textContent.trim(),
								variants: variants
							});
						});

						// Build variant line with variants in parentheses
						preferredWithVariants.forEach((item, index) => {
							let text = item.text;
							if (item.variants.length > 0) {
								text += ' (' + item.variants.join(', ') + ')';
							}

							const part = document.createElement('span');
							part.className = 'name-part';
							part.textContent = text;
							variantGroup.appendChild(part);

							// Add space after each part except the last
							if (index < preferredWithVariants.length - 1) {
								variantGroup.appendChild(document.createTextNode(' '));
							}
						});

						container.appendChild(variantGroup);
					}

					return container;				},
			"person": function(e) {
				const id = e.id;
				if (id) {
					const base = window.location.origin + window.location.pathname;
					const link = document.createElement('a');
					link.className = 'entry-link copy-link';
					link.href = `${base}#${id}`;
					link.title = `${base}#${id}`;
					link.innerHTML = '<i class="bi bi-link-45deg"></i><span class="copy-link-label">Copy link</span>';
					link.addEventListener('click', function(ev) {
						ev.preventDefault();
						copyEntryLink(link);
					});
					e.appendChild(link);
				}
				return undefined;
			}
		}
		};

		// Add the behaviors globally
		CETEIcean.addBehaviors(behaviors);
	</script>
